name: rfctf-client

on:
  push:
    branches: [main]
    paths: &paths
      - infrastructure_containers/Dockerfile.rfctf-client
      - infrastructure_containers/build-rfctf-client
      - infrastructure_containers/files/supervisord-client.conf
      - infrastructure_containers/make_gentoo_cache.sh
      - infrastructure_containers/tools/build_mac80211_hwsim.sh
      - tools/bench_healthcheck.sh
      - startup/rfhs-helpers.sh
      - .github/workflows/rfctf-client.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths: *paths
  # The binhost and pentoo-core move on without any change here.
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      directory: infrastructure_containers
      script: build-rfctf-client
      snapshot: true
      hwsim: true
      startup-wait: '180'
