name: shellcheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      # Every tracked file with a sh, bash or dash shebang, except symlinks
      - name: Run shellcheck
        run: |
          shellcheck --version
          mapfile -t scripts < <(git ls-files --format='%(objectmode) %(path)' | while read -r mode f; do
            if [ "${mode}" != 120000 ] && head -n 1 -- "${f}" | grep -qE '^#!.*\b(ba|da)?sh\b'; then
              printf '%s\n' "${f}"
            fi
          done)
          printf 'Checking %d scripts\n' "${#scripts[@]}"
          if ! shellcheck "${scripts[@]}"; then
            shellcheck -f gcc "${scripts[@]}" | sed -E \
              -e 's/^([^:]+):([0-9]+):([0-9]+): note: /::notice file=\1,line=\2,col=\3::/' \
              -e 's/^([^:]+):([0-9]+):([0-9]+): (error|warning): /::\4 file=\1,line=\2,col=\3::/'
            exit 1
          fi
