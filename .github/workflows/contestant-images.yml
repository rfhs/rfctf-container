# The pentoo contestant image is built in pentoo-images.yml
name: Contestant images

on:
  push:
    branches: [main]
    paths: &paths
      - contestant_containers/Dockerfile.kali
      - contestant_containers/Dockerfile.parrot
      - contestant_containers/Dockerfile.blackarch
      - contestant_containers/build-kali
      - contestant_containers/build-parrot
      - contestant_containers/build-blackarch
      - contestant_containers/files/**
      - .github/workflows/contestant-images.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths: *paths
  # Rolling distributions break without any change here.
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro: [kali, parrot, blackarch]
    uses: ./.github/workflows/build-image.yml
    with:
      directory: contestant_containers
      script: build-${{ matrix.distro }}
      startup-wait: '120'
      timeout-minutes: 180
