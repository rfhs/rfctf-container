name: kali

on:
  push:
    branches: [main]
    paths: &paths
      - contestant_containers/Dockerfile.kali
      - contestant_containers/build-kali
      - contestant_containers/files/*.words
      - contestant_containers/files/supervisord-debianish.conf
      - contestant_containers/files/contestant-checker
      - contestant_containers/tests/test_healthcheck.sh
      - contestant_containers/tests/test_firefox_sandbox.sh
      - tools/bench_healthcheck.sh
      - contestant_containers/files/contestant_start
      - startup/rfhs-helpers.sh
      - startup/rfhs-contestant-seccomp.json
      - misc/docker_userns_remap
      - misc/contestant_apparmor
      - tools/give_hwsim_radios.sh
      - infrastructure_containers/tools/build_mac80211_hwsim.sh
      - contestant_containers/files/kali_apt_update
      - contestant_containers/files/kali_panel_trim
      - contestant_containers/tests/test_kali_panel_trim.sh
      - .github/workflows/kali.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths: *paths
  # Rolling distributions break without any change here.
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      directory: contestant_containers
      script: build-kali
      contestant-host: true
      hwsim: true
      startup-wait: '120'
      timeout-minutes: 180
      publish: true
