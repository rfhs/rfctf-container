name: pentoo

on:
  push:
    branches: [main]
    paths: &paths
      - contestant_containers/Dockerfile.pentoo
      - contestant_containers/build-pentoo
      - contestant_containers/files/*.words
      - contestant_containers/files/supervisord-pentoo.conf
      - contestant_containers/files/contestant-checker
      - contestant_containers/tests/test_healthcheck.sh
      - contestant_containers/tests/test_firefox_sandbox.sh
      - tools/bench_healthcheck.sh
      - contestant_containers/files/contestant_start
      - startup/rfhs-helpers.sh
      - misc/docker_userns_remap
      - misc/contestant_apparmor
      - tools/give_hwsim_radios.sh
      - infrastructure_containers/tools/build_mac80211_hwsim.sh
      - infrastructure_containers/make_gentoo_cache.sh
      - .github/workflows/pentoo.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths: *paths
  # The binhost and pentoo-core move on without any change here.
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      directory: contestant_containers
      script: build-pentoo
      contestant-host: true
      hwsim: true
      snapshot: true
      startup-wait: '120'
