name: first_install

on:
  push:
    branches: [main]
    paths: &paths
      - misc/first_install
      - misc/docker_userns_remap
      - startup/**
      - tools/test_first_install_vm.sh
      - .github/workflows/first_install.yml
  pull_request:
    paths: *paths
  # Ubuntu and the images move on without any change here.
  schedule:
    - cron: '11 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vm:
    name: ${{ matrix.release }} ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04', '26.04']
        platform: [ec2, other]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm \
            /usr/local/julia* /opt/microsoft /opt/google /opt/az /usr/local/share/powershell \
            /usr/local/share/chromium
          docker system prune --all --force
          df -h /

      - name: Set up KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf

      - name: Test first_install and the startup scripts in a VM
        env:
          RELEASE: ${{ matrix.release }}
          PLATFORM: ${{ matrix.platform }}
        run: ./tools/test_first_install_vm.sh "${RELEASE}" "${PLATFORM}" "${RUNNER_TEMP}/vm"
