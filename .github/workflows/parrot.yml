name: parrot

on:
  push:
    branches: [main]
    paths: &paths
      - contestant_containers/Dockerfile.parrot
      - contestant_containers/build-parrot
      - contestant_containers/files/*.words
      - contestant_containers/files/supervisord-debianish.conf
      - contestant_containers/files/contestant-checker
      - contestant_containers/tests/test_healthcheck.sh
      - tools/bench_healthcheck.sh
      - contestant_containers/files/contestant_start
      - misc/docker_userns_remap
      - .github/workflows/parrot.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths: *paths
  # Rolling distributions break without any change here.
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      directory: contestant_containers
      script: build-parrot
      userns-remap: true
      startup-wait: '120'
      timeout-minutes: 180
      publish: true
