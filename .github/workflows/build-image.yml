# The build scripts only push to Docker Hub from the RFHS build hosts; with
# publish, this pushes to GitHub Container Registry
name: Build and test an image

on:
  workflow_call:
    inputs:
      directory:
        description: The build context, which holds the build script
        type: string
        required: true
      script:
        description: The build script, run as is
        type: string
        required: true
      snapshot:
        description: >-
          Make portage_and_overlay.tar.xz in the build context first, with
          infrastructure_containers/make_gentoo_cache.sh in pentoo-core
        type: boolean
        default: false
      hwsim:
        description: The test needs mac80211_hwsim radios and the host's iw and rfkill
        type: boolean
        default: false
      userns-remap:
        description: Build and test with docker's user namespace remapping, as the game hosts run it
        type: boolean
        default: false
      startup-wait:
        description: Seconds the test waits for the container to start (STARTUP_WAIT); empty keeps the script's own
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 360
      extra-test:
        description: A test run from the build context after the build script, with the image it built
        type: string
        default: ''
      extra-packages:
        description: Ubuntu packages extra-test needs on the runner
        type: string
        default: ''
      publish:
        description: >-
          On main, push the image the build script tagged to
          ghcr.io/<owner>/<DISTRO> as <VERS> and latest; the calling workflow
          has to grant packages: write
        type: boolean
        default: false

# No permissions here: a called workflow can't raise them, so each image's
# workflow sets its own, with packages: write only where it publishes.

jobs:
  build:
    name: ${{ inputs.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm \
            /usr/local/julia* /opt/microsoft /opt/google /opt/az /usr/local/share/powershell \
            /usr/local/share/chromium
          docker system prune --all --force
          df -h /

      # Fails when the binhost's trees are over a week old
      - name: Snapshot the trees the binhost was built from
        if: inputs.snapshot
        working-directory: .
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: |
          docker run --rm -v "${PWD}:/work" -w /work/infrastructure_containers \
            docker.io/pentoolinux/pentoo-core:latest \
            ./make_gentoo_cache.sh "/work/${DIRECTORY}/portage_and_overlay.tar.xz"
          # the container wrote it as root; chown keeps its time
          sudo chown "$(id -u):$(id -g)" "${DIRECTORY}/portage_and_overlay.tar.xz"
          ls -l --time-style=+%FT%T%z "${DIRECTORY}/portage_and_overlay.tar.xz"

      # The runner's Azure kernel has cfg80211 and mac80211 in linux-modules-extra
      # but, from 6.17, no mac80211_hwsim; fail rather than skip the test without it
      - name: Set up mac80211_hwsim
        if: inputs.hwsim
        run: |
          sudo apt-get update
          sudo apt-get install -y iw rfkill
          if ! modinfo mac80211_hwsim > /dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          fi
          if ! modinfo mac80211_hwsim > /dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"
            "${GITHUB_WORKSPACE}/infrastructure_containers/tools/build_mac80211_hwsim.sh" "${RUNNER_TEMP}"
            sudo install -D -m 644 "${RUNNER_TEMP}/mac80211_hwsim.ko" "/lib/modules/$(uname -r)/updates/mac80211_hwsim.ko"
            sudo depmod -a
          fi
          if ! sudo modprobe mac80211_hwsim radios=2; then
            echo "::error::mac80211_hwsim can't be loaded on this runner (kernel $(uname -r)), so the test can't run"
            sudo dmesg | tail -n 5
            exit 1
          fi
          iw dev
          sudo modprobe -r mac80211_hwsim

      - name: Turn on docker's user namespace remapping
        if: inputs.userns-remap
        run: sudo "${GITHUB_WORKSPACE}/misc/docker_userns_remap"

      - name: Build and test
        env:
          SCRIPT: ${{ inputs.script }}
          STARTUP_WAIT: ${{ inputs.startup-wait }}
        run: ./"${SCRIPT}"

      - name: Extra test
        if: inputs.extra-test != ''
        env:
          EXTRA_TEST: ${{ inputs.extra-test }}
          EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        run: |
          if [ -n "${EXTRA_PACKAGES}" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086
            sudo apt-get install -y --no-install-recommends ${EXTRA_PACKAGES}
          fi
          sh -c "${EXTRA_TEST}"

      # The label links a new package to this repository, which gives this
      # repository's workflows write access to it.
      - name: Publish to GitHub Container Registry
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          SCRIPT: ${{ inputs.script }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          distro="$(sed -n 's/^DISTRO="\(.*\)"$/\1/p' "${SCRIPT}")"
          vers="$(sed -n 's/^VERS="\(.*\)"$/\1/p' "${SCRIPT}")"
          : "${distro:?no DISTRO= in ${SCRIPT}}" "${vers:?no VERS= in ${SCRIPT}}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${distro}"
          printf '%s\n' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          printf 'FROM rfhs/%s:%s\n' "${distro}" "${vers}" | docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${image}:${vers}" -t "${image}:latest" -
          docker push "${image}:${vers}"
          docker push "${image}:latest"
          echo "Published ${image}:${vers} and ${image}:latest" >> "${GITHUB_STEP_SUMMARY}"

      # On failure the contestant scripts leave rfhs-<distro>-ci running.
      - name: Show the containers
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "${c}")"
            docker logs --tail 300 "${c}" 2>&1 || true
            docker exec "${c}" sh -c '
              for cfg in /etc/supervisord.conf /etc/supervisord/supervisord.conf /etc/supervisor/conf.d/supervisord.conf; do
                if [ -f "${cfg}" ]; then supervisorctl -c "${cfg}" status; break; fi
              done
              for f in /root/HEALTHCHECK_DEGRADED /var/log/supervisord.log; do
                if [ -s "${f}" ]; then echo "== ${f}"; tail -n 100 "${f}"; fi
              done' 2>&1 || true
            echo "::endgroup::"
          done
          docker image ls
          df -h /
